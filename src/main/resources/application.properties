spring.application.name=jwt-lecture-demo
server.port=${SERVER_PORT:8005}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jwt_demo?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

security.jwt.secret-key=${JWT_SECRET}
# Token lifetime in milliseconds. Default: 1 hour.
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
